# بيئة التطوير الكاملة (docs/00).
#
# ملاحظة: MinIO موجود عشان نجرّب S3 من يوم ١ من غير ما ندفع ولا نتصل
# بالإنترنت — الكود بيشوفه S3 عادي.

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: development
    volumes:
      - .:/var/www/html
    depends_on: [postgres, redis]
    environment:
      PHP_IDE_CONFIG: "serverName=fc-admin"
      PHP_OPCACHE_VALIDATE_TIMESTAMPS: "1"

  web:
    image: nginx:1.27-alpine
    ports: ["8443:443", "8080:80"]
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./docker/nginx/certs:/etc/nginx/certs
    depends_on: [app]

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: fc_admin
      POSTGRES_USER: fc
      POSTGRES_PASSWORD: secret
    # postgres 18+ بيحط PGDATA تحت /var/lib/postgresql/18 — ربط `/data` بيرفض يقوم
    volumes: ["pgdata:/var/lib/postgresql"]
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fc -d fc_admin"]
      interval: 10s
      retries: 5

  redis:
    image: redis:8-alpine
    command: redis-server --appendonly yes
    volumes: ["redisdata:/data"]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 5

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    volumes: ["miniodata:/data"]
    ports: ["9000:9000", "9001:9001"]

  horizon:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: development
    command: php artisan horizon
    volumes: ["./:/var/www/html"]
    depends_on: [redis, postgres]

  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: development
    command: php artisan schedule:work
    volumes: ["./:/var/www/html"]
    depends_on: [redis, postgres]

  reverb:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: development
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    volumes: ["./:/var/www/html"]
    ports: ["8081:8080"]
    depends_on: [redis]

volumes:
  pgdata: {}
  redisdata: {}
  miniodata: {}
