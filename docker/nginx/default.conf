server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name fc-admin.test *.fc-admin.test localhost;

    ssl_certificate     /etc/nginx/certs/local.pem;
    ssl_certificate_key /etc/nginx/certs/local-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/html/public;
    index index.php;

    charset utf-8;

    # لازم تتطابق مع upload_max_filesize في php.ini — الحد على الطبقتين
    client_max_body_size 24M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param HTTPS on;
        include fastcgi_params;
    }

    # مفيش تنفيذ PHP في مجلد الرفع (docs/20 بند ٧)
    location ^~ /storage/ {
        location ~ \.php$ { return 403; }
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    error_log  /var/log/nginx/fc-admin.error.log;
    access_log /var/log/nginx/fc-admin.access.log;
}
