; كل عمليات المنصة في حاوية واحدة — الأبسط على Coolify وعلى VPS.
[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[program:php-fpm]
command=php-fpm -F
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; الجدولة (بدل كرون) — النسخ الاحتياطي، التنظيف، الإعلانات المجدولة …
[program:scheduler]
command=php /var/www/html/artisan schedule:work
user=www-data
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; عامل طابور دايم — لذلك QUEUE_WORKER_VIA_SCHEDULER=false في الحاوية
[program:queue]
command=php /var/www/html/artisan queue:work --queue=critical,notifications,media,exports,default --sleep=3 --tries=3 --max-time=3600
user=www-data
autorestart=true
stopwaitsecs=60
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
