# nginx جوه الحاوية — TLS بيخلص عند Coolify (Traefik) أو Caddy قبله.
server {
    listen 80 default_server;
    server_name _;
    root /var/www/html/public;
    index index.php;

    client_max_body_size 64m;
    server_tokens off;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 300;
    }

    location /build/ {
        expires 1y;
        access_log off;
        try_files $uri =404;
    }

    # .env و.git وأي ملف مخفي — مع إن الجذر public/ بس
    location ~ /\.(?!well-known) {
        deny all;
    }
}
