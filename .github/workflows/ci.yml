name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: فحص الأسرار
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # أي سر مسرّب = رفض فوري (docs/20 بند ٨).
      #
      # بننزّل الـ CLI بدل `gitleaks/gitleaks-action@v2`: الأكشن بقى بيطلب
      # رخصة مدفوعة لأي مستودع تابع لمنظمة وبيفشل بـ «missing gitleaks
      # license». الـ CLI نفسه MIT ومجاني، ونفس الفحص بالظبط.
      - name: gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks git . --config .gitleaks.toml --redact --no-banner

  scripts:
    name: سكربتات النشر
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # `bash -n` بيمسك أخطاء التركيب بس. shellcheck بيمسك اللي بيعدّي منه —
      # زي backtick جوه نص مزدوج الاقتباس (= تنفيذ أمر بالغلط)، ومتغيّر
      # من غير اقتباس، و`|| true` على خطوة حرجة.
      - name: shellcheck
        run: shellcheck -x deploy.sh rollback.sh deploy/lib.sh install.sh docker/coolify/entrypoint.sh

  quality:
    name: الجودة والاختبارات (MySQL)
    runs-on: ubuntu-latest

    # MySQL — نفس القاعدة اللي الاستضافة المشتركة بتديها (docs/install).
    # وضع single بس: المنصة مدرّس واحد لكل تثبيت، والمثبّت بيقفل الوضع على
    # single. مصفوفة multi اتشالت مع Postgres — `composer test:multi` لسه
    # موجود لو حد احتاجه محلياً.
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: open_lms_testing
          MYSQL_ROOT_PASSWORD: secret
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -psecret"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, redis, gd, exif, intl, bcmath, zip
          coverage: none
          ini-values: memory_limit=1G

      - name: كاش الاعتماديات
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}

      - name: composer install
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: تجهيز البيئة
        run: |
          cp .env.example .env
          php artisan key:generate

      # ثغرة عالية أو حرجة = رسوب (docs/20 بند ١٢)
      - name: composer audit
        run: composer audit --no-dev

      - name: Pint
        run: vendor/bin/pint --test

      - name: PHPStan
        run: php -d memory_limit=2G vendor/bin/phpstan analyse --no-progress

      - name: Pest
        run: php -d memory_limit=1G vendor/bin/pest
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: open_lms_testing
          DB_USERNAME: root
          DB_PASSWORD: secret
          TENANCY_MODE: single

  # رحلات المستخدم في متصفح حقيقي (docs/17 بند ١٣). منفصلة عن `quality`
  # عشان محتاجة أصول مبنية + Chromium، وأبطأ بكتير من باقي الاختبارات.
  # على MySQL و single زي `quality`.
  browser:
    name: رحلات المستخدم (MySQL)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: open_lms_testing
          MYSQL_ROOT_PASSWORD: secret
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -psecret"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, redis, gd, exif, intl, bcmath, zip
          coverage: none
          ini-values: memory_limit=1G

      - name: كاش الاعتماديات
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}

      - name: composer install
        run: composer install --no-interaction --prefer-dist --no-progress

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # الجولات والثيم من الأصول المبنية — من غيرها الرحلة بتعدّي على صفحة من غير جولة
      - name: بناء الأصول
        run: |
          npm ci
          npm run build

      - name: Chromium
        run: npx playwright install --with-deps chromium

      - name: تجهيز البيئة
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: رحلات المستخدم
        run: composer test:browser
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: open_lms_testing
          DB_USERNAME: root
          DB_PASSWORD: secret
          TENANCY_MODE: single

      # لقطة الصفحة وقت الفشل = أسرع طريق لفهم رحلة مكسورة
      - name: لقطات الفشل
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-screenshots
          path: tests/Browser/Screenshots
          if-no-files-found: ignore

  assets:
    name: بناء الأصول
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # الأصول محتاجة vendor: `resources/css/filament/admin/theme.css`
      # بيستورد `vendor/filament/filament/resources/css/theme.css`.
      # من غير الخطوتين دول الـ build بيفشل بـ «Can't resolve».
      - name: PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: composer install
        run: composer install --no-dev --no-interaction --prefer-dist --no-progress --no-scripts

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm audit --audit-level=high || true
      - run: npm run build
