name: Release

# كل tag بيبدأ بـ v (v1.2.3) = zip جاهز للرفع على استضافة مشتركة:
# vendor (من غير dev) + public/build + .htaccess في الجذر، من غير .env ولا
# اختبارات ولا node_modules. الخطوات بعد الرفع: docs/install/shared-hosting.md

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: حزمة الاستضافة المشتركة
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, gd, exif, intl, bcmath, zip
          coverage: none
          tools: composer:v2

      - name: composer install (production)
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist --no-progress

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: npm ci && npm run build
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: تجميع الحزمة
        id: package
        run: deploy/package-release.sh "${GITHUB_REF_NAME}"

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.package.outputs.zip }}
          generate_release_notes: true
          body: |
            ## التثبيت

            - **استضافة مشتركة (cPanel / Hostinger):** نزّل `tafra-open-lms-${{ github.ref_name }}.zip` من تحت، ارفعه وفكّه، وافتح `/install`. الخطوات في `INSTALL-shared-hosting.md` جوه الحزمة.
            - **VPS:** `curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh | sudo bash`
            - **Coolify:** Docker Compose ← `docker-compose.coolify.yml`.
            - **نسخة تجربة:** `DEMO_MODE=true php artisan lms:demo` (أكاديمية ببيانات جاهزة، ودخول بضغطة).

            **المطلوب:** PHP 8.4 وMySQL 8 (أو MariaDB 10.6+)، وسطر Cron واحد. مش محتاج Redis ولا SSH.
            **دليل المدرّس:** `TEACHER-GUIDE.md` جوه الحزمة.

            **التحديث من إصدار قديم:**
            - على استضافة مشتركة: ارفع ملفات الحزمة الجديدة فوق القديمة، ماعدا `.env` و`storage`. المنصة بتكمّل التحديث لوحدها مع أول زيارة.
            - على VPS: شغّل أمر التثبيت تاني.

            ---

            **English:**
            - **Shared hosting:** upload and extract the zip below, then open `/install`.
            - **VPS:** one command (`install.sh`).
            - **Coolify:** `docker-compose.coolify.yml`.
            - **Requirements:** PHP 8.4, MySQL 8, one cron line.
