; Supervisor — جدولة Laravel
;
; البديل عن cron: حاوية/عملية واحدة بتشغّل schedule:work.
; لو بتستخدم cron بدلها:
;   * * * * * cd /var/www/app && php artisan schedule:run >> /dev/null 2>&1

[program:fc-scheduler]
process_name=%(program_name)s
command=php /var/www/app/artisan schedule:work
directory=/var/www/app
autostart=true
autorestart=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/www/app/storage/logs/scheduler.log
stopwaitsecs=60
