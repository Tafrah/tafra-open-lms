; Supervisor — Horizon
;
; stopwaitsecs عالي عن قصد: بيدّي الـ jobs الجارية وقت تخلص قبل ما
; Horizon يقفل، بدل ما تتقطع في نصها (docs/13 بند ٤).

[program:fc-horizon]
process_name=%(program_name)s
command=php /var/www/app/artisan horizon
directory=/var/www/app
autostart=true
autorestart=true
startretries=3
user=www-data
redirect_stderr=true
stdout_logfile=/var/www/app/storage/logs/horizon.log
stdout_logfile_maxbytes=10MB
stopasgroup=true
killasgroup=true
stopwaitsecs=3600
